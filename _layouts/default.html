<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- MathJax v3 Configuration -->
  {% include mathjax.html %}

  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --border-color: #262a38;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --code-bg: #1c202c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.65;
      font-size: 16px;
    }

    header.site-header {
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(22, 25, 34, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    html {
      scroll-behavior: smooth;
    }

    h1[id], h2[id], h3[id] {
      scroll-margin-top: 5rem;
    }

    .header-container {
      max-width: {% if page.toc %}1240px{% else %}900px{% endif %};
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: max-width 0.2s ease;
    }

    .site-brand a {
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .site-nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .site-nav a:hover {
      color: var(--accent-hover);
    }

    main.site-content {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }

    /* Table of Contents & Report Layout */
    .report-layout-wrapper {
      max-width: 1240px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      gap: 2.75rem;
      align-items: flex-start;
      position: relative;
    }

    .report-content {
      flex: 1 1 0%;
      min-width: 0;
      max-width: 880px;
      margin: 0;
      padding: 0;
    }

    .toc-sidebar {
      width: 270px;
      flex-shrink: 0;
      display: block;
    }

    .toc-sticky-container {
      position: -webkit-sticky;
      position: sticky;
      top: 5rem;
      max-height: calc(100vh - 6.5rem);
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }

    .toc-sticky-container::-webkit-scrollbar {
      width: 4px;
    }

    .toc-sticky-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .toc-card {
      background-color: rgba(22, 25, 34, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem 0.85rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .toc-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-hover);
      padding-bottom: 0.65rem;
      margin-bottom: 0.65rem;
      border-bottom: 1px solid var(--border-color);
    }

    .toc-icon {
      flex-shrink: 0;
      color: var(--accent-hover);
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }

    .toc-item {
      margin: 0;
      padding: 0;
    }

    .toc-link {
      display: block;
      font-size: 0.82rem;
      line-height: 1.35;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.5rem 0.35rem 0.85rem;
      border-left: 2px solid transparent;
      margin-left: -1px;
      border-radius: 0 4px 4px 0;
      transition: all 0.15s ease;
      word-break: break-word;
    }

    .toc-link:hover {
      color: #ffffff;
      background-color: rgba(59, 130, 246, 0.08);
      border-left-color: var(--accent-hover);
      text-decoration: none;
    }

    .toc-link.active {
      color: #60a5fa;
      font-weight: 600;
      background-color: rgba(59, 130, 246, 0.12);
      border-left-color: #3b82f6;
      text-decoration: none;
    }

    @media (max-width: 1060px) {
      .report-layout-wrapper {
        display: block;
        max-width: 900px;
        padding: 0 1.25rem;
        margin: 2rem auto;
      }
      .report-content {
        max-width: 100%;
      }
      .toc-sidebar {
        display: none;
      }
    }

    h1, h2, h3, h4, h5, h6 {
      color: #ffffff;
      font-weight: 600;
      line-height: 1.3;
      margin-top: 1.75rem;
      margin-bottom: 0.75rem;
    }

    h1 { font-size: 2.1rem; letter-spacing: -0.02em; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; margin-top: 2.25rem; }
    h3 { font-size: 1.2rem; }

    p { margin-top: 0; margin-bottom: 1.15rem; }

    a {
      color: var(--accent-hover);
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    a:hover {
      text-decoration: underline;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border-color);
      margin: 2rem 0;
    }

    /* MathJax formatting */
    mjx-container {
      outline: none !important;
    }

    mjx-container[display="true"] {
      margin: 1.25rem 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.75rem 0;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    th, td {
      padding: 0.65rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #1a1e29;
      color: #ffffff;
      font-weight: 600;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Blockquotes */
    blockquote {
      border-left: 3px solid var(--accent);
      margin: 1.5rem 0;
      padding: 0.6rem 1.25rem;
      background-color: rgba(59, 130, 246, 0.08);
      border-radius: 0 8px 8px 0;
      color: #cbd5e1;
    }

    blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Images */
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin: 1rem 0 0.5rem 0;
      display: block;
    }

    em {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Code */
    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88em;
      background-color: var(--code-bg);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      color: #e2e8f0;
      border: 1px solid #2d3345;
    }

    pre code {
      padding: 0;
      background-color: transparent;
      border: none;
    }

    pre {
      background-color: var(--code-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
    }

    footer.site-footer {
      border-top: 1px solid var(--border-color);
      margin-top: 4rem;
      padding: 2rem 1.25rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <div class="site-brand">
        <a href="{{ '/' | relative_url }}">Lucas Lebron</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Portfolio Home</a>
        <a href="{{ '/assets/docs/resume-lucas-lebron.pdf' | relative_url }}">Resume</a>
      </nav>
    </div>
  </header>

  {% if page.toc %}
  <div class="report-layout-wrapper">
    <main class="site-content report-content" id="report-content">
      {{ content }}
    </main>
    <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of Contents">
      <div class="toc-sticky-container">
        <div class="toc-card">
          <div class="toc-title">
            <svg class="toc-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span>On This Page</span>
          </div>
          <nav class="toc-nav" id="toc-nav">
            <!-- Dynamically populated from ## headers -->
          </nav>
        </div>
      </div>
    </aside>
  </div>
  {% else %}
  <main class="site-content">
    {{ content }}
  </main>
  {% endif %}

  {% if page.toc %}
  <script>
    (function() {
      function initTOC() {
        const tocNav = document.getElementById('toc-nav');
        if (!tocNav) return;

        const content = document.getElementById('report-content');
        if (!content) return;

        // Parse all ## headers (h2)
        const headings = content.querySelectorAll('h2');
        if (!headings || headings.length === 0) {
          const sidebar = document.getElementById('toc-sidebar');
          if (sidebar) sidebar.style.display = 'none';
          return;
        }

        const list = document.createElement('ul');
        list.className = 'toc-list';

        const items = [];

        headings.forEach(function(heading, index) {
          // Ensure heading has an ID
          if (!heading.id) {
            heading.id = heading.textContent
              .toLowerCase()
              .trim()
              .replace(/[^\w\s-]/g, '')
              .replace(/[\s_-]+/g, '-')
              .replace(/^-+|-+$/g, '') || ('section-' + (index + 1));
          }

          const li = document.createElement('li');
          li.className = 'toc-item';

          const link = document.createElement('a');
          link.className = 'toc-link';
          link.href = '#' + heading.id;
          link.textContent = heading.textContent.trim();
          link.setAttribute('data-target', heading.id);

          // Smooth scrolling on click
          link.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = heading.id;
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
              targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
              if (history.pushState) {
                history.pushState(null, null, '#' + targetId);
              } else {
                location.hash = '#' + targetId;
              }
            }
          });

          li.appendChild(link);
          list.appendChild(li);
          items.push({ heading: heading, link: link });
        });

        tocNav.appendChild(list);

        // Scroll spy to highlight active header while scrolling
        let ticking = false;
        function updateActiveLink() {
          const scrollPosition = window.scrollY + 130; // offset below sticky header
          let activeIndex = -1;

          for (let i = 0; i < items.length; i++) {
            const top = items[i].heading.getBoundingClientRect().top + window.scrollY;
            if (top <= scrollPosition) {
              activeIndex = i;
            } else {
              break;
            }
          }

          items.forEach(function(item, idx) {
            if (idx === activeIndex) {
              item.link.classList.add('active');
            } else {
              item.link.classList.remove('active');
            }
          });

          // Auto-scroll TOC container if the active link is scrolled out of view
          if (activeIndex >= 0) {
            const activeLink = items[activeIndex].link;
            const stickyContainer = document.querySelector('.toc-sticky-container');
            if (stickyContainer && stickyContainer.scrollHeight > stickyContainer.clientHeight) {
              const linkRect = activeLink.getBoundingClientRect();
              const containerRect = stickyContainer.getBoundingClientRect();
              if (linkRect.top < containerRect.top + 20 || linkRect.bottom > containerRect.bottom - 20) {
                activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              }
            }
          }

          ticking = false;
        }

        window.addEventListener('scroll', function() {
          if (!ticking) {
            window.requestAnimationFrame(updateActiveLink);
            ticking = true;
          }
        }, { passive: true });

        // Initial check
        updateActiveLink();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTOC);
      } else {
        initTOC();
      }
    })();
  </script>
  {% endif %}

  <footer class="site-footer">
    <p>Lucas Lebron • Aerospace & Mechanical Engineering Portfolio</p>
  </footer>
</body>
</html>
