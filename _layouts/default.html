<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- MathJax v3 Configuration -->
  {% include mathjax.html %}

  <style>
    :root {
      --bg-page: #FFFFFF;
      --bg-surface: #F3F4F6;
      --border-ink: #18181B;
      --border-subtle: #D4D4D8;
      --text-main: #09090B;
      --text-muted: #52525B;
      --accent-yellow: #FFCC00;
      --accent-yellow-hover: #E6B800;

      --bg-color: var(--bg-page);
      --card-bg: var(--bg-surface);
      --border-color: var(--border-ink);
      --accent: var(--accent-yellow);
      --accent-hover: var(--accent-yellow-hover);
      --code-bg: var(--bg-surface);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: clip;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.65;
      font-size: 16px;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }

    header.site-header {
      border-bottom: 1.5px solid var(--border-ink);
      background-color: var(--bg-page);
      position: relative;
      top: auto;
      z-index: 10;
    }

    h1[id], h2[id], h3[id] {
      scroll-margin-top: 1.5rem;
    }

    .header-container {
      max-width: {% if page.toc %}1280px{% else %}1050px{% endif %};
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      transition: max-width 0.2s ease;
    }

    .site-brand a {
      color: var(--text-main);
      font-family: var(--font-mono);
      font-weight: 700;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .site-nav a {
      color: var(--text-muted);
      font-family: var(--font-mono);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border: 1.5px solid transparent;
      border-radius: 2px;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .site-nav a:hover {
      background-color: var(--accent-yellow);
      color: var(--text-main);
      border-color: var(--border-ink);
      text-decoration: none;
    }

    main.site-content {
      max-width: 1050px;
      margin: 2.25rem auto;
      padding: 0 1.5rem;
    }

    /* Table of Contents & Report Layout */
    .report-layout-wrapper {
      max-width: 1280px;
      margin: 2.25rem auto;
      padding: 0 1.5rem;
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
      position: relative;
    }

    .report-content {
      flex: 1 1 0%;
      min-width: 0;
      max-width: 920px;
      margin: 0;
      padding: 0;
    }

    .toc-sidebar {
      width: 275px;
      flex-shrink: 0;
      position: -webkit-sticky;
      position: sticky;
      top: 1.5rem;
      align-self: flex-start;
      max-height: calc(100vh - 3rem);
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 1rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
      z-index: 50;
    }

    .toc-sidebar::-webkit-scrollbar {
      width: 4px;
    }

    .toc-sidebar::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 2px;
    }

    .toc-sticky-container {
      width: 100%;
    }

    .toc-card {
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-ink);
      border-radius: 3px;
      padding: 1rem 0.9rem;
      box-shadow: 4px 4px 0px var(--border-ink);
    }

    .toc-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-main);
      padding-bottom: 0.65rem;
      margin-bottom: 0.65rem;
      border-bottom: 1.5px solid var(--border-ink);
    }

    .toc-icon {
      flex-shrink: 0;
      color: var(--text-main);
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      border-left: 1.5px solid var(--border-subtle);
    }

    .toc-item {
      margin: 0;
      padding: 0;
    }

    .toc-link {
      display: block;
      font-size: 0.81rem;
      line-height: 1.38;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.35rem 0.55rem 0.35rem 0.85rem;
      border-left: 3px solid transparent;
      margin-left: -1.5px;
      border-radius: 0 2px 2px 0;
      transition: all 0.15s ease;
      word-break: break-word;
    }

    .toc-link:hover {
      color: var(--text-main);
      background-color: var(--bg-page);
      border-left-color: var(--border-ink);
      text-decoration: none;
    }

    .toc-link.active {
      color: var(--text-main);
      font-weight: 700;
      background-color: var(--accent-yellow);
      border-left-color: var(--border-ink);
      text-decoration: none;
    }

    @media (max-width: 1060px) {
      .report-layout-wrapper {
        display: block;
        max-width: 1050px;
        padding: 0 1.25rem;
        margin: 1.75rem auto;
      }
      .report-content {
        max-width: 100%;
      }
      .toc-sidebar {
        display: none;
      }
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--text-main);
      font-family: var(--font-sans);
      font-weight: 700;
      line-height: 1.25;
      margin-top: 2rem;
      margin-bottom: 0.8rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-top: 0;
    }

    h2 {
      font-size: 1.45rem;
      letter-spacing: -0.015em;
      border-bottom: 1.5px solid var(--border-ink);
      padding-bottom: 0.45rem;
      margin-top: 2.4rem;
    }

    h3 {
      font-size: 1.15rem;
    }

    p {
      margin-top: 0;
      margin-bottom: 1.1rem;
    }

    a {
      color: var(--text-main);
      text-decoration: underline;
      text-decoration-color: var(--accent-yellow);
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      font-weight: 600;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    a:hover {
      background-color: var(--accent-yellow);
      color: var(--text-main);
    }

    hr {
      border: 0;
      border-top: 1.5px solid var(--border-subtle);
      margin: 2rem 0;
    }

    /* Blueprint Action Bars, Buttons & Viewers */
    .bp-action-bar {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin: 1.35rem 0;
    }

    .bp-btn,
    a.bp-btn,
    button.bp-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 0.9rem;
      border-radius: 2px;
      border: 1.5px solid var(--border-ink);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .bp-btn-primary,
    a.bp-btn-primary,
    button.bp-btn-primary {
      background-color: var(--accent-yellow);
      color: var(--text-main);
      font-weight: 700;
    }

    .bp-btn-primary:hover,
    a.bp-btn-primary:hover,
    button.bp-btn-primary:hover {
      background-color: var(--accent-yellow-hover);
      color: var(--text-main);
      text-decoration: none;
    }

    .bp-btn-secondary,
    a.bp-btn-secondary,
    button.bp-btn-secondary {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-weight: 600;
    }

    .bp-btn-secondary:hover,
    a.bp-btn-secondary:hover,
    button.bp-btn-secondary:hover {
      background-color: var(--accent-yellow);
      color: var(--text-main);
      text-decoration: none;
    }

    .bp-viewer-card {
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-ink);
      border-radius: 3px;
      padding: 1.35rem;
      box-shadow: 4px 4px 0px var(--border-ink);
      margin: 1.75rem 0;
    }

    .bp-viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .bp-viewer-title {
      margin: 0;
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 700;
    }

    .bp-viewer-sub {
      margin: 0.2rem 0 0 0;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .bp-viewer-controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .bp-viewer-viewport {
      width: 100%;
      height: 520px;
      background: radial-gradient(circle at center, #FFFFFF 0%, #E4E4E7 100%);
      border: 1.5px solid var(--border-ink);
      border-radius: 2px;
      outline: none;
    }

    .bp-viewer-footer {
      margin-top: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .bp-video-card {
      margin: 1.75rem 0;
      background-color: var(--bg-surface);
      border: 1.5px solid var(--border-ink);
      border-radius: 3px;
      box-shadow: 4px 4px 0px var(--border-ink);
    }

    .bp-video-player {
      width: 100%;
      display: block;
      background-color: var(--bg-page);
    }

    .bp-video-caption {
      padding: 0.8rem 1.1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      background-color: var(--bg-page);
      border-top: 1.5px solid var(--border-ink);
    }

    /* MathJax formatting */
    mjx-container {
      outline: none !important;
    }

    mjx-container[display="true"] {
      margin: 1.25rem 0 !important;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.75rem 0;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.92rem;
      background-color: var(--bg-page);
      border-radius: 3px;
      border: 1.5px solid var(--border-ink);
      box-shadow: 4px 4px 0px var(--border-ink);
    }

    th, td {
      padding: 0.7rem 1rem;
      text-align: left;
      border-bottom: 1px dashed var(--border-subtle);
    }

    th {
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1.5px solid var(--border-ink);
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Blockquotes */
    blockquote {
      border: 1.5px solid var(--border-ink);
      border-left: 4px solid var(--accent-yellow);
      margin: 1.5rem 0;
      padding: 0.85rem 1.25rem;
      background-color: var(--bg-surface);
      border-radius: 3px;
      box-shadow: 3px 3px 0px var(--border-ink);
      color: var(--text-main);
    }

    blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Images */
    img {
      max-width: 100%;
      height: auto;
      border-radius: 3px;
      border: 1.5px solid var(--border-ink);
      box-shadow: 4px 4px 0px var(--border-ink);
      background-color: var(--bg-surface);
      margin: 1.25rem 0 0.5rem 0;
      display: block;
    }

    em {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Code */
    code {
      font-family: var(--font-mono);
      font-size: 0.86em;
      background-color: var(--bg-surface);
      padding: 0.15rem 0.38rem;
      border-radius: 2px;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    pre code {
      padding: 0;
      background-color: transparent;
      border: none;
    }

    pre {
      background-color: var(--bg-surface);
      padding: 1.1rem;
      border-radius: 3px;
      overflow-x: auto;
      border: 1.5px solid var(--border-ink);
      box-shadow: 4px 4px 0px var(--border-ink);
    }

    footer.site-footer {
      background-color: var(--bg-surface);
      border-top: 1.5px solid var(--border-ink);
      margin-top: 4rem;
      padding: 1.85rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <div class="site-brand">
        <a href="{{ '/' | relative_url }}">Lucas Lebron</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Portfolio Home</a>
        <a href="{{ '/class-schedule.html' | relative_url }}">Class Schedule</a>
        <a href="{{ '/assets/docs/resume-lucas-lebron.pdf' | relative_url }}">Resume</a>
      </nav>
    </div>
  </header>

  {% if page.toc %}
  <div class="report-layout-wrapper">
    <main class="site-content report-content" id="report-content">
      {{ content }}
    </main>
    <aside class="toc-sidebar" id="toc-sidebar" aria-label="Table of Contents">
      <div class="toc-sticky-container">
        <div class="toc-card">
          <div class="toc-title">
            <svg class="toc-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            <span>On This Page</span>
          </div>
          <nav class="toc-nav" id="toc-nav">
            <!-- Dynamically populated from ## headers -->
          </nav>
        </div>
      </div>
    </aside>
  </div>
  {% else %}
  <main class="site-content">
    {{ content }}
  </main>
  {% endif %}

  {% if page.toc %}
  <script>
    (function() {
      function initTOC() {
        const tocNav = document.getElementById('toc-nav');
        if (!tocNav) return;

        const content = document.getElementById('report-content');
        if (!content) return;

        const headings = content.querySelectorAll('h2');
        if (!headings || headings.length === 0) {
          const sidebar = document.getElementById('toc-sidebar');
          if (sidebar) sidebar.style.display = 'none';
          return;
        }

        const list = document.createElement('ul');
        list.className = 'toc-list';

        const items = [];

        headings.forEach(function(heading, index) {
          if (!heading.id) {
            heading.id = heading.textContent
              .toLowerCase()
              .trim()
              .replace(/[^\w\s-]/g, '')
              .replace(/[\s_-]+/g, '-')
              .replace(/^-+|-+$/g, '') || ('section-' + (index + 1));
          }

          const li = document.createElement('li');
          li.className = 'toc-item';

          const link = document.createElement('a');
          link.className = 'toc-link';
          link.href = '#' + heading.id;
          link.textContent = heading.textContent.trim();
          link.setAttribute('data-target', heading.id);

          link.addEventListener('click', function(e) {
            e.preventDefault();
            const targetId = heading.id;
            const targetElement = document.getElementById(targetId);
            if (targetElement) {
              targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
              if (history.pushState) {
                history.pushState(null, null, '#' + targetId);
              } else {
                location.hash = '#' + targetId;
              }
            }
          });

          li.appendChild(link);
          list.appendChild(li);
          items.push({ heading: heading, link: link });
        });

        tocNav.appendChild(list);

        let ticking = false;
        function updateActiveLink() {
          const scrollPosition = window.scrollY + 90;
          let activeIndex = -1;

          for (let i = 0; i < items.length; i++) {
            const top = items[i].heading.getBoundingClientRect().top + window.scrollY;
            if (top <= scrollPosition) {
              activeIndex = i;
            } else {
              break;
            }
          }

          items.forEach(function(item, idx) {
            if (idx === activeIndex) {
              item.link.classList.add('active');
            } else {
              item.link.classList.remove('active');
            }
          });

          if (activeIndex >= 0) {
            const activeLink = items[activeIndex].link;
            const stickyContainer = document.querySelector('.toc-sticky-container');
            if (stickyContainer && stickyContainer.scrollHeight > stickyContainer.clientHeight) {
              const linkRect = activeLink.getBoundingClientRect();
              const containerRect = stickyContainer.getBoundingClientRect();
              if (linkRect.top < containerRect.top + 20 || linkRect.bottom > containerRect.bottom - 20) {
                activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              }
            }
          }

          ticking = false;
        }

        window.addEventListener('scroll', function() {
          if (!ticking) {
            window.requestAnimationFrame(updateActiveLink);
            ticking = true;
          }
        }, { passive: true });

        updateActiveLink();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTOC);
      } else {
        initTOC();
      }
    })();
  </script>
  {% endif %}

  <footer class="site-footer">
    <p>Lucas Lebron • Aerospace & Mechanical Engineering Portfolio</p>
  </footer>
</body>
</html>
