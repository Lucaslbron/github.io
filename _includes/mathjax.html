<!-- MathJax v3 Configuration and Script -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    startup: {
      pageReady: () => {
        // Fallback pre-processor for any legacy <script type="math/tex"> tags from Jekyll/Kramdown
        document.querySelectorAll('script[type^="math/tex"]').forEach(node => {
          const display = node.getAttribute('type').includes('mode=display');
          const math = node.textContent;
          const replacement = document.createTextNode(display ? `\\[${math}\\]` : `\\(${math}\\)`);
          node.parentNode.replaceChild(replacement, node);
        });
        return MathJax.startup.defaultPageReady();
      }
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
